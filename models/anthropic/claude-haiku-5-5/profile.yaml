- id: judgment-4907576ea352b1d3
  scope: direct
  task_ids:
  - knowledge.rag
  related_task_ids: []
  assessment: conditional
  scope_note: Only the source-described task and setup; no transfer to unrelated tasks or routes.
  judgment: Anthropic’s modified WANDR evaluates cited fact collections retrieved from a frozen index, with
    Haiku 5.5 soft F1 rising from 3.5% at low to 49.9% at max effort.
  confidence: low
  supporting_evidence_ids:
  - src-5a6452e14543
  contradictory_evidence_ids: []
  conditions:
  - 500 tasks requiring tens to hundreds of entities and facts; frozen-index web search/fetch, programmatic
    tool calling and code execution with 980k-token task budget.
  - Opus 4.6 re-fetches cited URLs to judge whether they support each fact; invalid-format entity rows are
    dropped.
  - Visual graph inspection p123:low 3.5%,medium 12.9%,high 37.3%,xhigh 45.9%,max 49.9%.
  known_failure_modes:
  - Soft F1 mixes verified fact precision and requested collection recall; it is not an all-correct answer
    or retrieval-ranking rate.
  - Frozen index and judge differ from Perplexity’s live-web/GPT-5.4 setup; no cross-harness score equivalence.
  evidence_notes:
  - A documented external-retrieval and answer-support workflow is established, unlike the preselected-document
    OfficeQA configuration. General application RAG fit remains unestablished.
