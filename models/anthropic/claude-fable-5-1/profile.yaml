- id: judgment-f023edc397fdd671
  scope: direct
  task_ids:
  - coding.debugging
  related_task_ids: []
  assessment: conditional
  scope_note: Task-specific source claim under documented conditions; no transfer to other coding tasks.
  judgment: Repaired 43 of 105 hidden defects in one Claude Code/max run; use for assisted diagnosis and repair
    with material verification.
  confidence: low
  supporting_evidence_ids:
  - src-ad78a04807f9
  - src-02b09208ceab
  - src-0b72694a5dea
  - src-e86e19b3dd2c
  - src-e9c984ecc940
  - src-96cec7bbd029
  contradictory_evidence_ids: []
  conditions:
  - One round per repository on 2026-09-01; one configuration run, not repeated trials.
  - Approximately 28K-line TypeScript extension and 60K-line React/TypeScript Supabase LMS; 76 reverted real
    fixes plus 29 authored defects.
  - Native Claude Code; max is a documented first-party tier requested explicitly, not separately probed as
    binding.
  - No network or git history; preserve passing checks; diagnose symptoms and root causes and edit source in
    place.
  - Blind non-sibling judge compares diffs with withheld answer key; partials, claimed-only and extras do not
    increase strict score.
  - Metrics identify model=claude-fable-5-1 and a [1m] window request; precise CLI version and exact provider
    endpoint are not established in these inspected max-row receipts.
  known_failure_modes:
  - 62 seeded defects were not fully repaired in the inspected run; two fixes were partial and four were claimed
    without implementation.
  evidence_notes:
  - One run across two repositories; partial fixes and eleven unscored genuine extras do not increase the strict
    score.
  - Low confidence reflects withheld artifacts, no exact-configuration replication and unknown run variance.
  - Zero recorded false-positive fixes does not establish absence of regressions; this is repair evidence,
    not code-review recall.
  observed_at: '2026-10-08'
  effective_from: null
  provenance:
    origin: research
    research_batch_id: public-research-2026-10-07
    method: Curated bounded candidate scoped_debugging:claude-fable-5-1-debug-bughunt; exact identity gates
