  contradictory_evidence_ids: []
  conditions:
  - 397 scientific sentence inputs. Haiku certainty distortion was 48.1% for paraphrase and 74.8% for news-style
    rewriting. Generation used temperature 1, top_p 0.9 and a 3,500-token budget.
  - A GPT-5.4-mini judge evaluated both presentation orders. Human validation used 240 pairs and 129 annotators;
    human agreement alpha was about 0.25.
  known_failure_modes:
  - The metric concerns subjective certainty judgments. Provider, experiment day and repeated-generation variance
    are unknown. No claim is made about unconstrained fiction or every kind of prose.
  evidence_notes:
  - Judge-human consensus Kendall tau-B was 0.47 (SD 0.09), compared with 0.34 (SD 0.19) for individual humans.
    Opposite-direction judgments across presentation orders were flagged separately; no numeric inconsistency
    rate was verified in this pass.
