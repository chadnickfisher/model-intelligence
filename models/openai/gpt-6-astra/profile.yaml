- id: judgment-50e193772d714514
  scope: direct
  task_ids:
  - coding.debugging
  related_task_ids: []
  assessment: conditional
  scope_note: Task-specific source claim under documented conditions; no transfer to other coding tasks.
  judgment: Can repair a subset of hidden repository defects; use as an assisted audit, not a completeness
    guarantee.
  confidence: medium
  supporting_evidence_ids:
  - src-ad78a04807f9
  - src-02b09208ceab
  - src-0b72694a5dea
  contradictory_evidence_ids: []
  conditions:
  - Codex ChatGPT route; documented effort, not a separately measured effort magnitude.
  - 'Harness: Codex CLI; effort: max; effort evidence: first_party.'
  - 105 planted defects across TypeScript VS Code extension (~28K lines) and React/Supabase LMS (~60K lines).
  - One agentic round per repository; native CLI/tools; same task prompt but nonidentical harnesses, contexts
    and budgets.
  - Blind diff-based answer-key grading; extra unplanted fixes excluded; private corpus/judgments prevent full
    external reproduction.
  known_failure_modes:
  - Many planted defects remained unresolved in the measured runs.
  - Run variance and harness differences prevent fine-grained cross-model ranking.
  evidence_notes:
  - Result measures finding AND implementing fixes; do not relabel it as code-review recall or test-generation
    quality.
  - No matched independent contradiction located; partial successes and misses coexist.
  - Confidence concerns this bounded claim, not a capability score.
  observed_at: '2026-10-07'
