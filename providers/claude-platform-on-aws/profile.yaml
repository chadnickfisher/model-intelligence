schema_version: '1.0'
id: claude-platform-on-aws
verified_at: '2026-10-07'
name: Claude Platform on AWS
roles:
- cloud-platform
- access-product
api_compatibility:
- Claude API request format; platform-specific SDK clients remain beta; OpenAI-compatible endpoints unavailable.
access_methods:
- Marketplace enrollment, separate Anthropic organization; AWS IAM SigV4 or platform API key.
geographic_availability:
- AWS commercial regions for gateway access; gateway region does not establish inference residency; Haiku 4.5
  rejects inference_geo.
- Haiku 5.5 permits US-only inference at 1.1× or global at base price; gateway region is distinct from inference
  geography. AWS launch text described North America availability, so individual region entitlement remains
  untested.
- Opus 5.5 permits global routing or US-only inference at 1.1x. Gateway/workspace region and inference geography
  are distinct.
- Sonnet 5.5 supports global or US-only inference geography; US-only pricing is 1.1x across token categories.
  The AWS gateway region does not itself pin inference geography.
rate_limits:
- Anthropic usage tier and monthly spend caps apply; negotiated/account limits require confirmation.
- New organizations begin at Start; tier history comes from paid Marketplace invoices. Monthly caps reset first-of-month
  00:00 UTC; enforcement can lag about 2 hours and billed overshoot is possible.
- Organizations begin at Start; paid Marketplace history can raise tier. Calendar caps reset first-of-month
  00:00 UTC; enforcement can lag about two hours and overshoot is billed.
caching_batching:
- Prompt caching and batch processing documented; use the exact model eligibility and separate tariff.
privacy_data_use:
- Anthropic is an independent data processor; approved zero retention is opt-in. Content is processed/stored
  on AWS, with pre-September-18-2026 workspace exceptions.
- AWS Service Terms section 50.16 says Platform content is processed by Anthropic outside AWS; Anthropic technical
  guidance says AWS infrastructure for current workspaces, with pre-September 18, 2026 exceptions. The wording
  mismatch was not resolved into a universal residency guarantee.
