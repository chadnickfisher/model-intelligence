notes:
- Public access-product identity is distinct from Bedrock. Fable-specific documented policies were inspected
  on 2026-10-08; account entitlement and negotiated SLA remain unverified, and processing-scope wording differs
  between technical documentation and AWS terms.
- 'Earlier baseline: this new public access product’s policies and account entitlements had not been verified.
  Public documentation inspected on 2026-10-08 establishes Anthropic-managed rate/spend policies and opt-in
  zero data retention with the documented older-workspace exception. Private account entitlement, actual ZDR
  enrollment, negotiated limits and SLA remain unverified.'
limitations:
- No private entitlement, negotiated throughput or SLA inspected.
- Platform-wide exclusions include HIPAA-ready program participation, OAuth, OpenAI-compatible endpoints, fast
  mode and the newer computer/browser toolsets; older beta computer-use tools remain available.
- Spend accounting can lag about two hours, so usage may exceed a monthly cap or configured limit before requests
  stop; the excess is billed.
- Anthropic documents a capacity pool separate from both the first-party Claude API and Amazon Bedrock, allowing
  workloads to be spread across platforms. This does not establish outage independence, successful recovery
  or an uptime SLA.
- The service uses a separate capacity pool from first-party Claude API and Bedrock. Marketplace private offers
  and discounts do not automatically transfer.
- Spend accounting can lag by about two hours and overshoot is billed; zero retention requires explicit enrollment,
  and older workspaces have a documented infrastructure exception.
