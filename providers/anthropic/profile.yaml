name: Anthropic
roles:
- creator
- inference-provider
api_compatibility:
- Claude Messages API; consumer products and partner endpoints have separate authentication and billing.
access_methods:
- Commercial API key and billing account; consumer app/Code subscription sign-in is separate.
geographic_availability:
- Supported Regions Policy has separate API and Claude.ai lists; geography and ownership restrictions
  apply.
rate_limits:
- Haiku 4.5 standard maximums depend on Start/Build/Scale tiers; new-account evaluation and organization
  limits may be lower.
caching_batching:
- Haiku 4.5 cache minimum 4096 tokens; five-minute or one-hour TTL. Batch API tariff is separate from
  interactive client usage.
privacy_data_use:
- Commercial products default to no model training; explicit feedback or opt-in exceptions apply. Consumer
  Free/Pro/Max and their Code sessions have separate policies.
- Approved zero retention applies only to eligible commercial APIs/products and Enterprise Code, with
  safety/legal exceptions; no universal consumer guarantee.
