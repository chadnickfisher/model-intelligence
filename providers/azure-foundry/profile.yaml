limitations:
- For Fable 5.1 Hosted on Anthropic, Microsoft documents Preview without an SLA; this restriction is specific
  to that offering.
- Broad partner catalog conflicts with exact Opus 5.5/integration docs on image output, disabled thinking and
  hosting-specific tools; no runtime test resolved it.
- Earlier baseline privacy/quota gaps have now been investigated for Models sold by Azure and Claude Marketplace;
  these products have distinct processors and handling rules.
- Public Claude quotas are subscription/model/version/deployment-specific defaults. Individual allocations,
  negotiated agreements and retention/monitoring settings are unverified.
- Claude Sonnet 5.5 US Data Zone support is documented by Microsoft but excluded by Anthropic's Foundry guide;
  treat it as unresolved until the provider reconciles the docs.
