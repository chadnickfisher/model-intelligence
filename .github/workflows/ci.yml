name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate, render, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate canonical records
        run: python tools/validate.py

      - name: Regenerate derived outputs
        run: python tools/render.py

      - name: Run tests
        run: python -m pytest -q

      - name: Require committed generated outputs
        run: git diff --exit-code

      - name: Reject untracked generated outputs
        shell: bash
        run: |
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            printf 'Unexpected untracked files:\n%s\n' "$untracked"
            exit 1
          fi
